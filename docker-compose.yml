services:
  # Bundled Ollama for the default `make up` flow.
  # External Ollama users can skip this profile and run `make ollama-network`.
  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:0.6.5
    container_name: quantpilot-ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  quantpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantpilot-app
    env_file:
      - .env
    environment:
      QSEED_DATA_PATH: /data/qseed
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      DOCKER: "1"
    volumes:
      - ${QSEED_HOST_PATH:?Set QSEED_HOST_PATH in .env}:/data/qseed:ro
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  quantpilot-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantpilot-dev
    env_file:
      - .env
    environment:
      QSEED_DATA_PATH: /data/qseed
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      DOCKER: "1"
    volumes:
      - .:/app
      - /app/.venv
      - ${QSEED_HOST_PATH:?Set QSEED_HOST_PATH in .env}:/data/qseed:ro
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sleep infinity

volumes:
  ollama_models:
